# Override any subset in your own file; CLI options take final precedence.
iterations: 10
base: main
# Relative to the repository root, regardless of the YAML file's location.
db: .autoresearch/results.duckdb
model: gpt-6-astra
effort: xhigh
codex_timeout: 900
eval_timeout: 180
# Percent remaining required before starting each Codex attempt (0-100).
min_weekly_limit_remaining_allowed: 25
min_5h_limit_remaining_allowed: 5
# Workspace monthly credit limit, when the account reports one.
min_monthly_limit_remaining_allowed: 25
